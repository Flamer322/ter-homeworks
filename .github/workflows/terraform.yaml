name: "Terraform"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./02/src

    env:
      TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_vms_ssh_key: ${{ secrets.YC_VMS_SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1

      - name: Configure credentials
        run: |
          mkdir -p ~/.aws

          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id = ${{ secrets.YC_STORAGE_ACCESS_KEY }}
          aws_secret_access_key = ${{ secrets.YC_STORAGE_SECRET_KEY }}
          EOF

          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' > ~/.authorized_key.json

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false
